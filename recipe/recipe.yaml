schema_version: 1

context:
  version: "0.1.1"

package:
  name: amica
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/amica/amica-${{ version }}.tar.gz
  sha256: 2e3fbcd1610fb7109d5b2f4dbcc7d3f22a48d96c121fc3b3bbcabe14393e896f

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77.0
    - wheel
  run:
    - python >=${{ python_min }}
    # 0.1.1 is a pointer release: it ships no modules of its own and exists
    # only to pull in the renamed package. numpy and scipy come via jamica.
    - jamica >=0.2.0

tests:
  # There is no `amica` module to import any more -- `[tool.setuptools]
  # packages = []` upstream. What this release promises is that installing
  # `amica` still lands working code, so that is what the test checks.
  - python:
      imports:
        - jamica
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/snesmaeili/jamica
  repository: https://github.com/snesmaeili/jamica
  documentation: https://snesmaeili.github.io/jamica/
  summary: Renamed to jamica -- install `jamica` instead. This release installs it for you and ships no modules of its own.
  description: |
    amica has been renamed to jamica. Install `jamica` instead:

        conda install -c conda-forge jamica
        python -c "from jamica import Amica, AmicaConfig, fit_ica"

    This 0.1.1 release is a pointer. It contains no modules of its own -- it
    only depends on jamica, so an existing `amica` install still ends up with
    working code.

    The rename resolves a namespace collision. The name `amica` installed a
    top-level `amica` module, and so does amica-python, an independent
    implementation of the same algorithm by another author; the two overwrote
    each other in a shared environment. This release vacates the `amica` import
    namespace rather than squatting on it, which is why the previous
    `amica-python` run constraint is gone -- the two packages no longer share
    any files and can be co-installed.

    This is the final amica release. Development continues under jamica.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - snesmaeili
